<!DOCTYPE html>
<html>
<head>
    <title>MedChain DApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>MedChain Medicine Tracking</h1>

<button onclick="connectWallet()">Connect Wallet</button>
<p id="wallet"></p>

<hr>

<h2>Load Contract</h2>

<input id="contractAddress" placeholder="Paste MedSale contract address">
<button onclick="loadContract()">Load Contract</button>

<p id="status"></p>

<hr>

<h2>Verify Product</h2>

<input id="verifyTokenId" placeholder="Token ID">
<button onclick="verifyProduct()">Verify</button>

<p id="verifyResult"></p>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="app.js"></script>

</body>
</html>
